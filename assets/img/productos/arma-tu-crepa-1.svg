<!-- crepa doblada -->
<path d="M94 258c0-44 30-92 80-104 50-12 104 12 126 58 8 17 3 34-14 42l-168 34c-18 4-24-9-24-30z" fill="url(#crepe1)" stroke="#2a201a" stroke-width="6" stroke-linejoin="round"/>
