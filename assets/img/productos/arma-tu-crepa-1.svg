<path d="M118 236c34-46 84-66 138-48" fill="none" stroke="#f7e6c8" stroke-width="9" opacity=".55" stroke-linecap="round"/>

<!-- relleno asomando: crema -->
<path d="M122 250c22-32 60-48 96-42 24 4 44 18 54 38-44 16-104 20-150 4z" fill="#fff8ee" opacity=".92"/>

<!-- chocolate derretido -->
