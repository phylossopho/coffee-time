  <radialGradient id="plate3" cx="50%" cy="45%" r="55%">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#f0e7da"/>
  </radialGradient>
</defs>
<rect width="400" height="400" fill="url(#bg3)"/>
<circle cx="200" cy="205" r="150" fill="#ffffff" opacity=".3"/>
<ellipse cx="200" cy="318" rx="132" ry="22" fill="#2a201a" opacity=".14"/>
<ellipse cx="200" cy="300" rx="140" ry="58" fill="url(#plate3)"/>
<ellipse cx="200" cy="300" rx="140" ry="58" fill="none" stroke="#e3d7c5" stroke-width="3"/>

<!-- crepa doblada en triángulo -->
<path d="M92 264c6-50 44-96 100-100 54-4 100 34 116 80-52 34-160 44-216 20z" fill="url(#crepe3)" stroke="#2a201a" stroke-width="6" stroke-linejoin="round"/>
