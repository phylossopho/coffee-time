<circle cx="154" cy="232" r="8" fill="#efd390"/>
<circle cx="236" cy="226" r="16" fill="#f6dfa8" stroke="#d9b978" stroke-width="3"/>
<circle cx="236" cy="226" r="7" fill="#efd390"/>

