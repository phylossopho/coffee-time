<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Crepa salada con jamón, queso y pepperoni">
<defs>
  <radialGradient id="bg3" cx="28%" cy="18%" r="92%">
    <stop offset="0" stop-color="#f8ecd8"/>
    <stop offset="1" stop-color="#e7d3b5"/>
  </radialGradient>
  <linearGradient id="crepe3" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f2d8a4"/>
    <stop offset=".55" stop-color="#e5bb77"/>
    <stop offset="1" stop-color="#d29c53"/>
