<path d="M280 246l-5-9 8 3 4-9 4 9 8-3-5 9" fill="#3f7a4e"/>
<circle cx="276" cy="258" r="1.8" fill="#ffe6c9"/>
<circle cx="286" cy="262" r="1.8" fill="#ffe6c9"/>
<circle cx="281" cy="270" r="1.8" fill="#ffe6c9"/>

