<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Crepa dulce con chocolate, plátano y fresa">
<defs>
  <radialGradient id="bg1" cx="28%" cy="18%" r="92%">
    <stop offset="0" stop-color="#f7ecdd"/>
    <stop offset="1" stop-color="#e6d2ba"/>
  </radialGradient>
  <linearGradient id="crepe1" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f3d9a6"/>
    <stop offset=".55" stop-color="#e7bd77"/>
    <stop offset="1" stop-color="#d9a45c"/>
  </linearGradient>
  <linearGradient id="choco1" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#5b3423"/>
    <stop offset="1" stop-color="#2f1a11"/>
  </linearGradient>
  <radialGradient id="plate1" cx="50%" cy="45%" r="55%">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#f1e8dc"/>
  </radialGradient>
</defs>
<rect width="400" height="400" fill="url(#bg1)"/>
<circle cx="200" cy="205" r="150" fill="#ffffff" opacity=".32"/>
<ellipse cx="200" cy="318" rx="132" ry="22" fill="#2a201a" opacity=".14"/>
<ellipse cx="200" cy="300" rx="140" ry="58" fill="url(#plate1)"/>
